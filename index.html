
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0a" id="themeMeta">
<title>WILFIT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{--bg:#0a0a0a;--card:#111316;--line:#262a30;--g:#1ed760;--gd:#1f4d31;--mut:#8b929c;--red:#f87171;--amb:#fbbf24;--text:#ffffff;--sec:#9aa3ad;--inp:#0c0d0f;--chip:#14171b;--dark:#1b1e23;--darktxt:#ffffff;--track:#23262b;--avbg:#0f2a1a;--avtxt:#1ed760;--nav:#0d0e10;--okbg:#11301d;--oktxt:#1ed760;--warnbg:#3a2a0a;--warnline:#6b4c12;--redline:#4a1d1d;--btxt:#06140a;--steps:#d6dbe1}
body{color-scheme:dark}
body.light{color-scheme:light;--bg:#f4f5f7;--card:#ffffff;--line:#d9dde3;--g:#16a34a;--gd:#a7d9b9;--mut:#5b6470;--red:#dc2626;--amb:#b45309;--text:#111111;--sec:#4b5563;--inp:#ffffff;--chip:#ffffff;--dark:#e7eaee;--darktxt:#111111;--track:#e5e7eb;--avbg:#dcf5e6;--avtxt:#0b6b33;--nav:#ffffff;--okbg:#dcf5e6;--oktxt:#0b6b33;--warnbg:#fef3c7;--warnline:#f5d28a;--redline:#f3c4c4;--btxt:#ffffff;--steps:#374151}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;width:100%;overflow-x:hidden}
#root{max-width:430px;margin:0 auto;padding:18px 16px 130px;min-height:100vh}
h1{font-size:26px;font-weight:800}
h3{font-size:17px;font-weight:700;margin:4px 0;word-break:break-word}
.t{font-weight:700;font-size:15px}
.sub{color:var(--mut);font-size:14px;margin:6px 0 16px}
.lab{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--sec)}
.muted{color:var(--mut);font-size:13px}
.brand{font-weight:900;letter-spacing:3px;color:var(--g);font-size:18px;margin-bottom:14px}
.sec{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--sec);margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{border-color:var(--gd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.n{font-size:22px;font-weight:800;margin-top:6px}
.av{width:56px;height:56px;border-radius:50%;background:var(--avbg);color:var(--avtxt);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:0 0 auto;border:1px solid var(--gd)}
.av img{width:100%;height:100%;object-fit:cover}
.thumb{width:100%;height:160px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:10px;display:block}
.bar{height:6px;background:var(--track);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.bar div{height:100%;background:var(--g);transition:width .3s}
.bars{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:12px}
.bars div{flex:1;background:var(--g);opacity:.85;border-radius:4px 4px 0 0;min-height:4px}
input,select,textarea{width:100%;background:var(--inp);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:16px;margin-top:6px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
select{background-image:linear-gradient(45deg,transparent 50%,#9aa3ad 50%),linear-gradient(135deg,#9aa3ad 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:80px;resize:vertical}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:700;background:var(--g);color:var(--btxt);cursor:pointer;margin-top:10px;text-align:center;font-family:inherit;touch-action:manipulation}
.btn.ghost{background:transparent;color:var(--g);border:1px solid var(--gd)}
.btn.dark{background:var(--dark);color:var(--darktxt);border:1px solid var(--line)}
.btn.red{background:transparent;color:var(--red);border:1px solid var(--redline)}
.btn.link{background:none;color:var(--g);border:none;padding:8px;font-weight:600}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:12px;margin-top:0;border-radius:10px}
.tools{display:flex;gap:8px;margin-bottom:14px}
.tools .btn{margin-top:0;flex:1;padding:9px 10px;font-size:12px}
.plus{width:56px;height:56px;border-radius:16px;border:1px dashed var(--gd);background:var(--inp);color:var(--g);font-size:30px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;flex:0 0 auto}
.badge{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--dark);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--oktxt);border-color:var(--gd)}
.badge.warn{background:var(--warnbg);color:var(--amb);border-color:var(--warnline)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:10px 0;-webkit-overflow-scrolling:touch}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;font-size:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--mut);cursor:pointer;font-family:inherit;touch-action:manipulation}
.chip.on{background:var(--okbg);color:var(--oktxt);border-color:var(--gd)}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:8px;background:var(--dark);border:1px solid var(--line);margin:4px 4px 0 0}
.tag.main{background:var(--okbg);color:var(--oktxt);border-color:var(--gd)}
.ex{background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.steps{font-size:14px;line-height:1.6;color:var(--steps)}
.msg{font-size:13px;color:var(--amb);margin-top:10px;min-height:16px}
.prev{margin-top:8px}
.prev img{width:100%;height:160px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:430px;background:var(--nav);border-top:1px solid var(--line);display:grid;padding:8px 2px calc(12px + env(safe-area-inset-bottom));z-index:10}
.nav:empty{display:none}
.nav button{background:none;border:none;color:var(--mut);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;min-width:0;padding:2px 0;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button i{font-style:normal;font-size:18px}
.nav button.on{color:var(--g)}
.wf-rest{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:406px;background:var(--card);color:var(--text);border:1px solid var(--g);border-radius:16px;padding:12px 14px;z-index:98;display:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.wf-rest.on{display:block}
.wf-rest.end{background:var(--g);color:var(--btxt)}
.wf-rest.end .lab{color:var(--btxt)}
.wf-rest.end .bar{background:rgba(0,0,0,.2)}
.wf-rest.end .bar div{background:var(--btxt)}
.wf-time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.wf-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wf-btns{display:flex;gap:6px;margin-top:8px}
.wf-b{flex:1;min-width:0;border:1px solid var(--line);background:var(--dark);color:var(--darktxt);border-radius:10px;padding:8px 6px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;touch-action:manipulation}
.wf-b.on{border-color:var(--g);color:var(--g)}

/* ---------- LOGIN (novo visual) ---------- */
.auth{min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center;padding:4px 0 0;background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(30,215,96,.16),transparent 70%)}
body.light .auth{background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(22,163,74,.14),transparent 70%)}
.auth-top{display:flex;justify-content:flex-end;gap:8px}
.ico{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;font-family:inherit;padding:0}
.ico:active{transform:scale(.95)}
.logo{text-align:center;margin:18px 0 24px}
.logo-mark{width:76px;height:76px;margin:0 auto 14px;border-radius:24px;background:linear-gradient(145deg,var(--g),#0f9a45);color:var(--btxt);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(30,215,96,.28)}
.logo-name{font-size:36px;font-weight:900;letter-spacing:6px;color:var(--text);line-height:1}
.logo-name span{color:var(--g)}
.tagline{color:var(--mut);font-size:14px;margin-top:10px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--inp);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{border:none;background:none;color:var(--mut);padding:10px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.seg button.on{background:var(--g);color:var(--btxt)}
.auth-card h2{font-size:20px;font-weight:800}
.auth-card .sub{margin:4px 0 6px}
.amsg{font-size:13px;line-height:1.4;border-radius:12px;padding:10px 12px;margin-top:12px;background:var(--warnbg);color:var(--amb);border:1px solid var(--warnline)}
.amsg.ok{background:var(--okbg);color:var(--oktxt);border-color:var(--gd)}
.admin-link{margin:16px auto 0;background:none;border:none;color:var(--mut);font-size:12px;cursor:pointer;padding:10px 14px;font-family:inherit;display:flex;align-items:center;gap:6px;touch-action:manipulation}
.admin-link:hover{color:var(--g)}
</style>
</head>

<script>
(function(){
"use strict";
var KEY="wilfit_v3";
var GROUPS=["Peito","Costas","Pernas","Ombros","Bíceps","Tríceps","Abdômen"];

var BASE=[
["supino-reto","Supino reto com barra","Peito","Peso livre","Peitoral maior","Deite no banco, segure a barra um pouco mais larga que os ombros, desça até o peito e empurre."],

];
var FIRST=BASE[0][0];

/* ---------- ESTADO ---------- */
// workouts = sessões (treino em andamento/feito, com séries registradas)
// meus     = treinos salvos (modelos), criados na Biblioteca ou em Meus treinos
var DEF={users:[],workouts:[],meus:[],customEx:[],session:null,adminOn:false,tab:"inicio",adminTab:"pendentes",sel:null,exOpen:null,exQ:"",exG:"Todos",exT:"Todos",draft:[],editing:false,theme:"dark",restSec:60,mt:{view:"list",id:null,ex:null,fd:null},migV:0,f:{}};
var S=load();
var authMode="login",authMsg="",toastT=null,pendingPhoto=null,storageWarned=false;

function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){
  var s=null;
  try{var r=window.localStorage.getItem(KEY);if(r)s=JSON.parse(r);}catch(e){}
  var o=Object.assign(clone(DEF),(s&&typeof s==="object")?s:{});
  ["users","workouts","meus","customEx","draft"].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[];});
  if(!o.f||typeof o.f!=="object")o.f={};
  if(!o.mt||typeof o.mt!=="object")o.mt=clone(DEF.mt);
  return o;
}
function save(){
  try{window.localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){
    if(!storageWarned){storageWarned=true;toast("Atenção: o navegador bloqueou o armazenamento. Seus dados podem não ser mantidos ao fechar.");}
  }
}
function $(id){return document.getElementById(id);}
function nid(){return String(Date.now())+Math.random().toString(16).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function initials(n){var p=String(n||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase();}
function greet(){var h=new Date().getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";}
function sameDay(d){return new Date(d).toDateString()===new Date().toDateString();}
function allEx(){return BASE.concat(S.customEx||[]);}
function exById(id){var a=allEx();for(var i=0;i<a.length;i++)if(a[i][0]===id)return a[i];return null;}
function exName(id){var e=exById(id);return e?e[1]:"Exercício removido";}
function me(){return S.users.find(function(u){return u.id===S.session;})||null;}
function myW(){var u=me();return u?S.workouts.filter(function(w){return w.uid===u.id;}):[];}
function myT(){var u=me();return u?S.meus.filter(function(r){return r.uid===u.id;}):[];}
function getT(id){return S.meus.find(function(r){return r.id===id;})||null;}
function avatar(u){var ph=u&&u.photo;return '<div class="av">'+(ph?'<img src="'+ph+'" alt="">':esc(initials(u&&u.name)))+'</div>';}
function F(n){if(!S.f[n])S.f[n]={};return S.f[n];}
function fv(n,k,d){var f=S.f[n];var v=f?f[k]:undefined;return v==null?(d==null?"":d):v;}
function clearF(n){delete S.f[n];}
function daysText(r){
  return (r.days&&r.days.length)?ORD.filter(function(d){return r.days.indexOf(d)>-1;}).map(function(d){return DAYS[d];}).join(" · "):"Sem dia definido";
}
function exSel(f){var id=fv(f,"ex",FIRST);return exById(id)?id:FIRST;}

/* Confirmação por duplo toque (confirm() nativo é bloqueado em previews) */
var cfKey="",cfTime=0;
function ask(key,msg){
  var n=Date.now();
  if(cfKey===key&&n-cfTime<4000){cfKey="";return true;}
  cfKey=key;cfTime=n;toast(msg+" Toque de novo para confirmar.");return false;
}

function toast(m){
  var t=$("toast");
  if(!t){
    t=document.createElement("div");t.id="toast";
    t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#1ed760;color:#06140a;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:99;max-width:90%;text-align:center;display:none";
    document.body.appendChild(t);
  }
  t.textContent=m;t.style.display="block";
  clearTimeout(toastT);toastT=setTimeout(function(){t.style.display="none";},3200);
}

/* ---------- MIGRAÇÃO (unifica treinos antigos em "Meus treinos") ---------- */
function migrate(){
  if(S.migV>=1)return;
  function has(u,name){var n=String(name).toLowerCase();return S.meus.some(function(r){return r.uid===u&&String(r.name).toLowerCase()===n;});}
  (S.plans||[]).forEach(function(p){
    if(p&&p.uid&&p.name&&!has(p.uid,p.name))S.meus.push({id:p.id||nid(),uid:p.uid,name:p.name,days:(p.days||[]).slice(),exs:(p.exs||[]).map(function(x){return {id:x.id||nid(),exId:x.exId,sets:x.sets,reps:x.reps,load:x.load};}),created:Date.now()});
  });
  S.workouts.slice().reverse().forEach(function(w){
    if(!w||!w.uid||!w.name||has(w.uid,w.name))return;
    S.meus.push({id:nid(),uid:w.uid,name:w.name,days:[],exs:(w.exs||[]).map(function(x){return {id:nid(),exId:x.exId,sets:x.sets,reps:x.reps,load:x.load};}),created:Date.parse(w.date)||Date.now()});
  });
  S.workouts.forEach(function(w){
    if(w.tid)return;
    var n=String(w.name).toLowerCase();
    var r=S.meus.find(function(x){return x.uid===w.uid&&String(x.name).toLowerCase()===n;});
    if(r)w.tid=r.id;
  });
  S.plans=[];S.migV=1;save();
}
migrate();

/* ---------- TEMA E TELA CHEIA ---------- */
function applyTheme(){
  var light=S.theme==="light";
  document.body.className=light?"light":"";
  var m=$("themeMeta");if(m)m.setAttribute("content",light?"#f4f5f7":"#0a0a0a");
}
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFS(){
  var msg="Tela cheia indisponível aqui. No celular, use 'Adicionar à tela inicial' do navegador.";
  try{
    var d=document,el=d.documentElement;
    if(isFs()){
      var ex=d.exitFullscreen||d.webkitExitFullscreen;
      if(ex){var p=ex.call(d);if(p&&p.catch)p.catch(function(){});}
      return;
    }
    var req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!req){toast(msg);return;}
    var r=req.call(el);
    if(r&&r.catch)r.catch(function(){toast(msg);});
  }catch(e){toast("Tela cheia indisponível aqui.");}
}
function toolsHtml(){
  return '<div class="tools"><button class="btn dark" data-a="toggleTheme">'+(S.theme==="light"?"☾ Modo escuro":"☀ Modo claro")+'</button><button class="btn dark" data-a="toggleFS">⛶ '+(isFs()?"Sair da tela cheia":"Tela cheia")+'</button></div>';
}

/* ---------- ALUNO: INÍCIO ---------- */
function wStats(){
  var ws=myW(),series=0,done=0,days={},maxLoad=0,exMap={};
  ws.forEach(function(w){w.exs.forEach(function(e){
    if(e.done)done++;
    e.logs.forEach(function(l){
      series++;
      if(l.load>maxLoad)maxLoad=l.load;
      if(l.ts)days[new Date(l.ts).toDateString()]=1;
      (exMap[e.exId]=exMap[e.exId]||[]).push({ts:l.ts||0,load:l.load});
    });
  });});
  var gain=0;
  Object.keys(exMap).forEach(function(k){
    var a=exMap[k].sort(function(x,y){return x.ts-y.ts;});
    var d=a[a.length-1].load-a[0].load;if(d>0)gain+=d;
  });
  var streak=0,d=new Date();
  if(!days[d.toDateString()])d.setDate(d.getDate()-1);
  while(days[d.toDateString()]){streak++;d.setDate(d.getDate()-1);}
  var week=[],wd=["D","S","T","Q","Q","S","S"];
  for(var i=6;i>=0;i--){
    var dt=new Date();dt.setDate(dt.getDate()-i);
    var key=dt.toDateString(),c=0;
    ws.forEach(function(w){w.exs.forEach(function(e){e.logs.forEach(function(l){if(l.ts&&new Date(l.ts).toDateString()===key)c++;});});});
    week.push({l:wd[dt.getDay()],c:c});
  }
  return {tpl:myT().length,series:series,done:done,maxLoad:maxLoad,days:Object.keys(days).length,gain:gain,streak:streak,week:week};
}
function sessionCard(w){
  var tot=0,fin=0;
  w.exs.forEach(function(e){tot+=e.sets;fin+=Math.min(e.logs.length,e.sets);});
  var pct=tot?Math.round(fin/tot*100):0;
  var list=w.exs.map(function(e){return '<div class="muted" style="margin-top:4px">• '+esc(exName(e.exId))+' — '+e.sets+'x'+e.reps+(e.load?' · '+e.load+' kg':'')+(e.done?' ✓':'')+'</div>';}).join("");
  var open=S.sel===w.id;
  var h='<div class="card hero"><div class="row"><div class="lab">Em andamento · '+new Date(w.date).toLocaleDateString("pt-BR")+'</div><span class="badge '+(pct===100?'ok':'')+'">'+pct+'%</span></div>'+
    '<h3>'+esc(w.name)+'</h3><div class="muted">'+w.exs.length+' exercícios · '+fin+'/'+tot+' séries</div><div class="bar"><div style="width:'+pct+'%"></div></div>'+list+
    '<div class="two2"><button class="btn" style="margin-top:10px" data-a="selW" data-id="'+w.id+'">'+(open?'Fechar treino':'Abrir treino')+'</button><button class="btn red" style="margin-top:10px" data-a="delW" data-id="'+w.id+'">Excluir</button></div></div>';
  if(open)h+=w.exs.map(function(ex){return exCard(w,ex);}).join("");
  return h;
}
function homeHtml(u){
  var name=u.nick||u.name.split(" ")[0];
  var st=wStats(),today=new Date().getDay();
  var head='<div class="row" style="margin-bottom:14px"><div style="flex:1;min-width:0"><div class="lab">'+greet()+'</div><h1 style="font-size:22px">'+esc(name)+'</h1></div>'+avatar(u)+'</div>';
  var sess=myW().filter(function(w){return sameDay(w.date);});
  var pend=myT().filter(function(t){return (t.days||[]).indexOf(today)>-1&&!sess.some(function(w){return w.tid===t.id;});});
  var hero='<div class="sec" style="margin-top:4px">Treino do dia</div>';
  hero+=sess.map(sessionCard).join("");
  hero+=pend.map(function(t){
    return '<div class="card hero"><div class="row"><div class="lab">Hoje · '+DAYS[today]+'</div><span class="badge">Não iniciado</span></div><h3>'+esc(t.name)+'</h3><div class="muted">'+t.exs.length+' exercício(s)</div>'+
    '<button class="btn" data-a="mtStart" data-id="'+t.id+'">Iniciar treino</button></div>';
  }).join("");
  if(!sess.length&&!pend.length){
    hero+=myT().length?
      '<div class="card hero"><h3>Nenhum treino marcado para hoje</h3><p class="muted">Escolha um dos seus treinos salvos ou defina os dias de cada um.</p><button class="btn" data-a="tab" data-v="meus">Ir para Meus treinos</button></div>':
      '<div class="card hero"><h3>Nenhum treino ainda</h3><p class="muted">Monte seu primeiro treino na Biblioteca.</p><button class="btn" data-a="tab" data-v="treinos">Ir para a Biblioteca</button></div>';
  }
  var max=Math.max.apply(null,st.week.map(function(x){return x.c;}).concat([1]));
  var bars='<div class="bars">'+st.week.map(function(x){return '<div style="height:'+Math.max(4,x.c/max*100)+'%" title="'+x.c+' séries"></div>';}).join("")+'</div>'+
    '<div style="display:flex;gap:4px;margin-top:4px">'+st.week.map(function(x){return '<div class="muted" style="flex:1;text-align:center;font-size:11px">'+x.l+'</div>';}).join("")+'</div>';
  var prog='<div class="sec">Evolução</div><div class="grid">'+
    '<div class="stat"><div class="lab">Séries feitas</div><div class="n">'+st.series+'</div></div>'+
    '<div class="stat"><div class="lab">Dias treinados</div><div class="n">'+st.days+'</div></div>'+
    '<div class="stat"><div class="lab">Sequência</div><div class="n">'+st.streak+'d</div></div>'+
    '<div class="stat"><div class="lab">Carga ganha</div><div class="n">+'+st.gain.toFixed(1).replace(/\.0$/,"")+' kg</div></div></div>'+
    '<div class="card" style="margin-top:10px"><div class="lab">Séries nos últimos 7 dias</div>'+bars+'</div>'+
    '<button class="btn dark" data-a="tab" data-v="progresso">Ver progresso detalhado</button>';
  var ach=[
    ["🏁","Primeiro treino","Salve um treino",st.tpl>=1],
    ["💪","10 séries","Registre 10 séries",st.series>=10],
    ["⚡","50 séries","Registre 50 séries",st.series>=50],
    ["🏆","100 séries","Registre 100 séries",st.series>=100],
    ["✅","Exercício completo","Finalize um exercício",st.done>=1],
    ["📈","Evoluiu a carga","Aumente a carga em um exercício",st.gain>0],
    ["🔥","3 dias de treino","Treine em 3 dias diferentes",st.days>=3],
    ["🥇","Sequência de 3 dias","Treine 3 dias seguidos",st.streak>=3],
    ["🏋","Carga 50 kg","Faça uma série com 50 kg ou mais",st.maxLoad>=50]
  ];
  var got=ach.filter(function(a){return a[3];}).length;
  var conq='<div class="sec">Conquistas ('+got+'/'+ach.length+')</div><div class="grid">'+ach.map(function(a){
    return '<div class="stat" style="'+(a[3]?'border-color:var(--gd)':'opacity:.45')+'"><div style="font-size:22px">'+a[0]+'</div><div class="t" style="margin-top:6px">'+a[1]+'</div><div class="muted">'+(a[3]?'Conquistada':a[2])+'</div></div>';
  }).join("")+'</div>';
  return head+hero+prog+conq;
}
function exCard(w,ex){
  var done=Math.min(ex.logs.length,ex.sets),pct=Math.round(done/ex.sets*100);
  var logs=ex.logs.map(function(l,i){return (i+1)+"ª: "+l.load+"kg x "+l.reps;}).join(" · ");
  return '<div class="card"><div class="row"><div style="min-width:0"><div class="t">'+esc(exName(ex.exId))+'</div><div class="muted">'+ex.sets+'x'+ex.reps+' · '+ex.load+' kg</div></div><span class="badge '+(ex.done?"ok":"")+'">'+(ex.done?"Finalizado":done+"/"+ex.sets+" séries")+'</span></div>'+
  '<div class="bar"><div style="width:'+pct+'%"></div></div>'+
  (logs?'<div class="muted">'+esc(logs)+'</div>':'')+
  '<div class="two2"><div><div class="lab">Reps</div><input type="number" inputmode="numeric" min="1" data-f="ser" data-k="'+ex.id+'r" value="'+esc(fv("ser",ex.id+"r",ex.reps))+'"></div><div><div class="lab">Kg</div><input type="number" inputmode="decimal" min="0" step="0.5" data-f="ser" data-k="'+ex.id+'l" value="'+esc(fv("ser",ex.id+"l",ex.load))+'"></div></div>'+
  '<div class="two2"><button class="btn" style="margin-top:8px" data-a="regSet" data-w="'+w.id+'" data-x="'+ex.id+'">Registrar série</button><button class="btn dark" style="margin-top:8px" data-a="undoSet" data-w="'+w.id+'" data-x="'+ex.id+'">Desfazer</button></div>'+
  '<div class="two2"><button class="btn dark" style="margin-top:8px" data-a="finEx" data-w="'+w.id+'" data-x="'+ex.id+'">'+(ex.done?"Reabrir":"Finalizar exercício")+'</button><button class="btn red" style="margin-top:8px" data-a="delEx" data-w="'+w.id+'" data-x="'+ex.id+'">Remover</button></div></div>';
}

function progressoHtml(){
  var map={},series=0;
  myW().forEach(function(w){w.exs.forEach(function(ex){ex.logs.forEach(function(l){series++;(map[ex.exId]=map[ex.exId]||[]).push({ts:l.ts||0,load:l.load});});});});

  var head='<h1>Progresso</h1><p class="sub">Evolução de carga por exercício</p>';
  if(!ids.length)return head+'<div class="card muted">Registre séries na aba Início para ver sua evolução.</div>';

  ids.map(function(id){
    var a=map[id].sort(function(x,y){return x.ts-y.ts;}).map(function(x){return x.load;});
    var first=a[0],last=a[a.length-1],max=Math.max.apply(null,a),d=last-first;

/* ---------- CRONÔMETRO DE DESCANSO ---------- */
var wfBox=document.createElement("div");
wfBox.className="wf-rest";
wfBox.setAttribute("role","timer");
wfBox.innerHTML='<div class="wf-row"><div><div class="lab" id="wfLab">Descanso</div><div class="wf-time" id="wfTime">0:00</div></div><button type="button" class="wf-b" id="wfClose" style="flex:0 0 auto;padding:8px 14px">Fechar</button></div>'+
  '<div class="bar"><div id="wfBar" style="width:100%"></div></div><div class="wf-btns" id="wfBtns"></div>';
document.body.appendChild(wfBox);
var WF_PRESETS=[30,45,60,90,120];
var wfT=null,wfHide=null,wfEnd=0,wfTotal=0,wfCtx=null;
function wfFmt(s){var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r;}
function wfBtns(){
  var cur=S.restSec||60;
  $("wfBtns").innerHTML=WF_PRESETS.map(function(p){return '<button type="button" class="wf-b'+(p===cur?" on":"")+'" data-wf="'+p+'">'+p+'s</button>';}).join("");
}
function wfStop(){
  clearInterval(wfT);clearTimeout(wfHide);wfT=null;
  wfBox.classList.remove("on");wfBox.classList.remove("end");
}
function wfBeep(){
  try{
    if(wfCtx){
      var o=wfCtx.createOscillator(),g=wfCtx.createGain();
      o.type="sine";o.frequency.value=880;g.gain.value=0.15;
      o.connect(g);g.connect(wfCtx.destination);
      o.start();o.stop(wfCtx.currentTime+0.35);
    }
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([250,120,250]);}catch(e){}
}
function wfTick(){
  var left=Math.max(0,Math.ceil((wfEnd-Date.now())/1000));
  $("wfTime").textContent=wfFmt(left);
  $("wfBar").style.width=(wfTotal?Math.round(left/wfTotal*100):0)+"%";
  if(left<=0){
    clearInterval(wfT);wfT=null;
    wfBox.classList.add("end");
    $("wfLab").textContent="Descanso acabou! Próxima série";
    wfBeep();
    wfHide=setTimeout(wfStop,10000);
  }
}
function wfStart(sec){
  clearInterval(wfT);clearTimeout(wfHide);
  try{
    if(!wfCtx&&(window.AudioContext||window.webkitAudioContext))wfCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(wfCtx&&wfCtx.state==="suspended")wfCtx.resume();
  }catch(e){}
  wfTotal=sec;wfEnd=Date.now()+sec*1000;
  wfBox.classList.remove("end");wfBox.classList.add("on");
  $("wfLab").textContent="Descanso";
  wfBtns();wfTick();
  wfT=setInterval(wfTick,250);
}
wfBox.addEventListener("click",function(e){
  var t=e.target;
  if(t.id==="wfClose"){wfStop();return;}
  var v=t.getAttribute&&t.getAttribute("data-wf");
  if(v){S.restSec=parseInt(v,10);save();wfStart(S.restSec);}
});

  },
  adminTab:function(el){S.adminTab=el.dataset.v;save();render();window.scrollTo(0,0);},
  setMode:function(el){authMode=el.dataset.v;authMsg="";render();},
  adminLogin:function(){S.adminOn=true;S.session="admin";S.adminTab="pendentes";authMsg="";save();render();},
  doAuth:function(){
    var a=F("auth");
    var mail=String(a.mail||"").trim().toLowerCase();
    if(!mail||mail.indexOf("@")<1){authMsg="Informe um e-mail válido.";render();return;}
    if(authMode==="signup"){
      var nm=String(a.nome||"").trim();
      if(!nm){authMsg="Informe seu nome.";render();return;}
      if(S.users.some(function(u){return u.email===mail;})){authMsg="Este e-mail já está cadastrado.";render();return;}
      S.users.push({id:nid(),name:nm,email:mail,status:"pending",photo:null,nick:"",birth:"",phone:"",weight:"",height:"",goal:"",notes:""});
      clearF("auth");authMode="login";authMsg="Cadastro enviado! Aguarde a aprovação do administrador.";save();render();return;
    }
    var u=S.users.find(function(x){return x.email===mail;});
    if(!u){authMsg="E-mail não encontrado. Crie uma conta.";render();return;}
    if(u.status!=="approved"){
      authMsg=u.status==="pending"?"Sua conta está pendente de aprovação.":"Sua conta não foi aprovada ou está bloqueada.";
      render();return;
    }
    S.session=u.id;S.adminOn=false;S.tab="inicio";clearF("auth");authMsg="";save();render();
  },
  logout:function(){wfStop();S.session=null;S.adminOn=false;S.tab="inicio";S.sel=null;S.exOpen=null;S.editing=false;authMsg="";save();render();},

  /* Biblioteca: Caixa de treino */
  wkDay:function(el){toggleDay(F("wk"),+el.dataset.v);save();render();},
  addDraft:function(){
    var x=readEx("wk");if(!x)return;
    S.draft.push(x);save();render();toast("Exercício adicionado à Caixa de treino.");
  },
  delDraft:function(el){S.draft.splice(+el.dataset.i,1);save();render();},
  saveW:function(){
    var name=String(fv("wk","nome","")).trim();
    if(!name){toast("Dê um nome ao treino.");return;}
    if(!S.draft.length){toast("Adicione pelo menos um exercício.");return;}
    var u=me();if(!u)return;
    S.meus.push({id:nid(),uid:u.id,name:name,days:pickDays(F("wk")),exs:S.draft.map(function(d){return {id:nid(),exId:d.exId,sets:d.sets,reps:d.reps,load:d.load};}),created:Date.now()});
    S.draft=[];clearF("wk");save();render();
    toast("Treino salvo! Ele já aparece em Meus treinos.");
  },
  setG:function(el){S.exG=el.dataset.v;save();render();},
  setT:function(el){S.exT=el.dataset.v;save();render();},
  openEx:function(el){S.exOpen=el.dataset.v;save();render();window.scrollTo(0,0);},
  closeEx:function(){S.exOpen=null;save();render();},
  addToWorkout:function(el){
    var id=el.dataset.v,e=exById(id);if(!e)return;
    var sets=parseInt(fv("wk","sets",3),10)||3,reps=parseInt(fv("wk","reps",10),10)||10,load=parseFloat(fv("wk","load",0))||0;
    S.draft.push({exId:id,sets:sets,reps:reps,load:load});
    save();render();
    toast('"'+e[1]+'" adicionado à Caixa de treino ('+S.draft.length+'). Ela fica no topo da Biblioteca.');
  },

  /* Sessões (treino em andamento no Início) */
  selW:function(el){S.sel=S.sel===el.dataset.id?null:el.dataset.id;save();render();},
  delW:function(el){
    if(!ask("delW"+el.dataset.id,"Excluir este treino em andamento e suas séries?"))return;
    S.workouts=S.workouts.filter(function(w){return w.id!==el.dataset.id;});
    if(S.sel===el.dataset.id)S.sel=null;
    save();render();toast("Treino excluído.");
  },
  regSet:function(el){
    var c=curX(el);if(!c)return;var ex=c.x;
    if(ex.done){toast("Exercício finalizado. Reabra para registrar séries.");return;}
    if(ex.logs.length>=ex.sets){toast("Todas as séries já foram registradas.");return;}
    var reps=parseInt(fv("ser",ex.id+"r",ex.reps),10),load=parseFloat(fv("ser",ex.id+"l",ex.load));
    if(!(reps>0)){toast("Informe um número de repetições válido.");return;}
    ex.logs.push({reps:reps,load:isNaN(load)?0:load,ts:Date.now()});
    save();render();toast("Série registrada.");
    wfStart(S.restSec||60);
  },
  undoSet:function(el){
    var c=curX(el);if(!c)return;
    if(!c.x.logs.length){toast("Nenhuma série para desfazer.");return;}
    c.x.logs.pop();c.x.done=false;save();render();
  },
  finEx:function(el){var c=curX(el);if(!c)return;c.x.done=!c.x.done;save();render();},
  delEx:function(el){
    var c=curX(el);if(!c)return;
    if(!ask("delEx"+c.x.id,"Remover este exercício do treino?"))return;
    c.w.exs=c.w.exs.filter(function(x){return x.id!==c.x.id;});
    save();render();
  },

  /* Perfil */
  editP:function(){
    var u=me();if(!u)return;
    S.f.perfil={nick:u.nick||"",name:u.name||"",birth:u.birth||"",phone:u.phone||"",weight:u.weight||"",height:u.height||"",goal:u.goal||"",notes:u.notes||""};
    S.editing=true;save();render();
  },
  cancelP:function(){clearF("perfil");S.editing=false;save();render();},
  saveP:function(){
    var u=me();if(!u)return;
    var p=S.f.perfil||{};
    var name=String(p.name||"").trim();
    if(!name){toast("O nome não pode ficar vazio.");return;}
    if(p.weight!==""&&p.weight!=null&&!(parseFloat(p.weight)>0)){toast("Peso inválido.");return;}
    if(p.height!==""&&p.height!=null&&!(parseFloat(p.height)>0)){toast("Altura inválida.");return;}
    u.nick=String(p.nick||"").trim();u.name=name;u.birth=p.birth||"";u.phone=p.phone||"";
    u.weight=p.weight||"";u.height=p.height||"";u.goal=String(p.goal||"").trim();u.notes=String(p.notes||"").trim();
    clearF("perfil");S.editing=false;save();render();toast("Perfil salvo!");
  },
  pickPhoto:function(el){pendingPhoto=el.dataset.v||"perfil";var inp=$("fileIn");inp.value="";inp.click();},
  rmPhoto:function(){var u=me();if(u){u.photo=null;save();render();}},
  rmExFoto:function(){if(S.f.exo)delete S.f.exo.foto;save();render();},

  /* Admin */
  setSt:function(el){
    var u=S.users.find(function(x){return x.id===el.dataset.id;});if(!u)return;
    u.status=el.dataset.s;save();render();toast("Status atualizado: "+ST[u.status]+".");
  },
  delUser:function(el){
    var u=S.users.find(function(x){return x.id===el.dataset.id;});if(!u)return;
    if(!ask("delUser"+u.id,"Excluir o aluno "+u.name+" e todos os treinos dele?"))return;
    S.users=S.users.filter(function(x){return x.id!==u.id;});
    S.workouts=S.workouts.filter(function(w){return w.uid!==u.id;});
    S.meus=S.meus.filter(function(r){return r.uid!==u.id;});
    save();render();toast("Aluno excluído.");
  },
  addAluno:function(){
    var n=F("novo");
    var nome=String(n.nome||"").trim(),mail=String(n.email||"").trim().toLowerCase();
    if(!nome){toast("Informe o nome do aluno.");return;}
    if(mail.indexOf("@")<1){toast("Informe um e-mail válido.");return;}
    if(S.users.some(function(u){return u.email===mail;})){toast("Este e-mail já está cadastrado.");return;}
    S.users.push({id:nid(),name:nome,email:mail,status:"approved",photo:null,nick:"",birth:"",phone:String(n.phone||""),weight:"",height:"",goal:String(n.goal||""),notes:""});
    clearF("novo");S.adminTab="alunos";save();render();toast("Aluno cadastrado e aprovado.");
  },
  addEx:function(){
    var nome=String(fv("exo","nome","")).trim(),musc=String(fv("exo","musculo","")).trim(),exec=String(fv("exo","exec","")).trim();
    if(!nome){toast("Informe o nome do exercício.");return;}
    if(!musc){toast("Informe o músculo principal.");return;}
    if(!exec){toast("Descreva como executar.");return;}
    S.customEx.push(["custom-"+nid(),nome,fv("exo","grupo","Peito"),fv("exo","tipo","Peso livre"),musc,exec,F("exo").foto||null]);
    clearF("exo");save();render();toast("Exercício cadastrado.");
  },
  delEx2:function(el){
    if(!ask("delEx2"+el.dataset.id,"Excluir este exercício do banco?"))return;
    S.customEx=S.customEx.filter(function(e){return e[0]!==el.dataset.id;});
    save();render();
  },

  /* Meus treinos */
  mtNew:function(){S.f.mt={nome:"",days:[]};mtGo("form",null);},
  mtFilter:function(el){mtSt().fd=el.dataset.v==="all"?null:parseInt(el.dataset.v,10);save();render();},
  mtDay:function(el){toggleDay(F("mt"),+el.dataset.v);save();render();},
  mtSave:function(){
    var st=mtSt(),u=me();if(!u)return;
    var nome=String(fv("mt","nome","")).trim();
    if(!nome){toast("Dê um nome ao treino.");return;}
    var days=pickDays(F("mt"));
    var r=st.id?getT(st.id):null;
    if(r){r.name=nome;r.days=days;}
    else{r={id:nid(),uid:u.id,name:nome,days:days,exs:[],created:Date.now()};S.meus.push(r);}
    clearF("mt");mtGo("detail",r.id);toast("Treino salvo!");
  },
  mtCancel:function(){var id=mtSt().id;clearF("mt");mtGo(id?"detail":"list",id);},
  mtOpen:function(el){mtGo("detail",el.dataset.id);},
  mtBack:function(){clearF("mta");clearF("mte");mtGo("list",null);},
  mtEditMeta:function(){
    var r=curT();if(!r)return;
    S.f.mt={nome:r.name,days:(r.days||[]).slice()};
    mtGo("form",r.id);
  },
  mtDel:function(){
    var r=curT();if(!r)return;
    if(!ask("mtDel"+r.id,'Excluir o treino "'+r.name+'" completo?'))return;
    S.meus=S.meus.filter(function(x){return x.id!==r.id;});
    mtGo("list",null);toast("Treino excluído.");
  },
  mtAddEx:function(){
    var r=curT();if(!r)return;
    var x=readEx("mta");if(!x)return;
    x.id=nid();r.exs.push(x);
    clearF("mta");save();render();toast("Exercício adicionado.");
  },
  mtEditEx:function(el){
    var r=curT();if(!r)return;
    var x=r.exs.find(function(e){return e.id===el.dataset.x;});if(!x)return;
    S.f.mte={ex:x.exId,sets:x.sets,reps:x.reps,load:x.load};
    mtSt().ex=x.id;save();render();
  },
  mtCancelEx:function(){clearF("mte");mtSt().ex=null;save();render();},
  mtSaveEx:function(el){
    var r=curT();if(!r)return;
    var x=r.exs.find(function(e){return e.id===el.dataset.x;});if(!x)return;
    var n=readEx("mte");if(!n)return;
    x.exId=n.exId;x.sets=n.sets;x.reps=n.reps;x.load=n.load;
    clearF("mte");mtSt().ex=null;save();render();toast("Exercício atualizado.");
  },
  mtDelEx:function(el){
    var r=curT();if(!r)return;
    if(!ask("mtDelEx"+el.dataset.x,"Excluir este exercício do treino?"))return;
    r.exs=r.exs.filter(function(e){return e.id!==el.dataset.x;});
    save();render();toast("Exercício excluído.");
  },
  mtStart:function(el){
    var r=getT(el.dataset.id),u=me();if(!r||!u)return;
    var exs=r.exs.filter(function(x){return exById(x.exId);});
    if(!exs.length){toast("Adicione exercícios antes de iniciar.");return;}
    var cur=S.workouts.find(function(w){return w.uid===u.id&&w.tid===r.id&&sameDay(w.date);});
    if(!cur){
      cur={id:nid(),uid:u.id,tid:r.id,name:r.name,date:new Date().toISOString(),exs:exs.map(function(x){return {id:nid(),exId:x.exId,sets:x.sets,reps:x.reps,load:x.load,done:false,logs:[]};})};
      S.workouts.unshift(cur);
    }
    S.sel=cur.id;S.tab="inicio";
    save();render();window.scrollTo(0,0);toast("Treino aberto! Registre as séries aqui.");
  }
};

document.addEventListener("click",function(e){
  var el=e.target.closest&&e.target.closest("[data-a]");
  if(!el)return;
  var fn=A[el.dataset.a];
  if(fn)fn(el);
});
function onField(e){
  var t=e.target;if(!t)return;
  if(t.id==="exSearch"){S.exQ=t.value;save();var box=$("exList");if(box)box.innerHTML=exListHtml();return;}
  if(t.dataset&&t.dataset.f){
    F(t.dataset.f)[t.dataset.k]=t.value;save();
    if(t.dataset.prev){var p=$(t.dataset.prev);if(p)p.innerHTML=prevHtml(t.value);}
  }
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!S.session&&e.target&&e.target.dataset&&e.target.dataset.f==="auth"){e.preventDefault();A.doAuth();}
});
document.addEventListener("fullscreenchange",render);
document.addEventListener("webkitfullscreenchange",render);

$("fileIn").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var dest=pendingPhoto;pendingPhoto=null;
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var m=480,k=Math.min(1,m/Math.max(img.width,img.height));
      var c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var data=c.toDataURL("image/jpeg",0.8);
      if(dest==="exo"){F("exo").foto=data;save();render();toast("Foto do exercício adicionada!");}
      else{var u=me();if(u){u.photo=data;save();render();toast("Foto atualizada!");}}
    };
    img.onerror=function(){toast("Não foi possível carregar a imagem.");};
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
});

wfBtns();
render();
})();
</script>
<script type="text/plain" id="wf-cardio-src">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wilfit • Cardio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#060807;--card:#12151b;--in:#0a0c10;--line:#242830;--mut:#9aa1ab;--g:#1fd860;--g2:#14b34a;--ink:#04170b;--warn:#ffb020;--bad:#ff5d5d;
--font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--black:"Arial Black","Segoe UI Black","Segoe UI",system-ui,sans-serif}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:#fff;min-height:100vh;background-image:radial-gradient(560px 280px at 50% -50px,rgba(31,216,96,.20),transparent 70%);background-repeat:no-repeat;background-attachment:fixed}
h1,h2,h3,.black{font-family:var(--black);font-weight:900}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.app,.view{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.view{min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#2fe672,#14b34a);display:grid;place-items:center;box-shadow:0 8px 30px rgba(31,216,96,.38)}
.logo svg{width:26px;height:26px;fill:#052410}
.wm{font-family:var(--black);font-weight:900;font-size:11px;letter-spacing:.32em}
.wm b{color:var(--g)}
.top h1{font-size:26px;line-height:1.1;margin-top:2px}
.sub{color:var(--mut);font-size:13px}
.tools{display:flex;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(18,21,27,.8);display:grid;place-items:center;color:#cfd4da}
.ibtn:hover{border-color:#3a414b}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.on{color:var(--g)}
.seg{display:flex;gap:6px;background:var(--in);border:1px solid var(--line);border-radius:18px;padding:5px}
.seg button{flex:1;padding:12px 8px;border-radius:13px;font-weight:800;font-size:14px;color:var(--mut);transition:.15s;min-height:44px}
.seg button.on{background:var(--g);color:var(--ink);box-shadow:0 4px 18px rgba(31,216,96,.25)}
.seg button:not(.on):hover{color:#fff}
.seg.sm button{padding:9px 6px;font-size:13px;min-height:38px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:16px}
.card h2{font-size:19px;margin-bottom:4px}
.lbl{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.lbl:first-child{margin-top:0}
.muted{color:var(--mut);font-size:13px;line-height:1.45}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type{border:1px solid var(--line);background:var(--in);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mut);transition:.15s;min-height:92px}
.type svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.type.on{border-color:var(--g);color:var(--g);background:rgba(31,216,96,.08);box-shadow:0 0 0 3px rgba(31,216,96,.08)}
.field{display:flex;flex-direction:column}
input[type=text],input[type=number],select{width:100%;background:var(--in);border:1px solid #262a31;border-radius:14px;padding:14px;color:#fff;font-size:16px;font-family:inherit;min-height:50px}
input::placeholder{color:#5d646e}
input:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(31,216,96,.15);outline:0}
input.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:12px;margin-top:6px;min-height:0}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stepper{display:flex;gap:8px;align-items:stretch}
.stepper button{width:50px;border-radius:14px;border:1px solid #262a31;background:var(--in);font-size:22px;font-weight:700;flex:none}
.stepper button:hover{border-color:var(--g);color:var(--g)}
.stepper input{text-align:center;font-weight:800;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mut);background:var(--in)}
.chip:hover,.chip.on{border-color:var(--g);color:var(--g)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.tile{background:var(--in);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.tile small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.tile b{font-family:var(--black);font-size:20px;font-weight:900}
.tile i{font-style:normal;color:var(--mut);font-size:11px;display:block;margin-top:2px}
.btn{width:100%;min-height:54px;border-radius:16px;background:var(--g);color:var(--ink);font-weight:800;font-size:16px;transition:.15s;box-shadow:0 8px 26px rgba(31,216,96,.22)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--in);border:1px solid var(--line);color:#fff;box-shadow:none}
.btn.ghost:hover{border-color:var(--g);color:var(--g)}
.btn.danger{background:transparent;border:1px solid rgba(255,93,93,.5);color:var(--bad);box-shadow:none}
.btn.sm{min-height:42px;font-size:14px;border-radius:13px}
.gps{display:flex;gap:12px;align-items:flex-start;background:var(--in);border:1px solid var(--line);border-radius:18px;padding:14px}
.dot{width:12px;height:12px;border-radius:50%;background:#555c66;flex:none;margin-top:5px}
.dot.ok{background:var(--g);box-shadow:0 0 0 4px rgba(31,216,96,.2)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}
.gps b{display:block;font-size:14px}
.map{width:100%;display:block;border-radius:18px;background:#0b0e0d;border:1px solid var(--line);touch-action:none}
.map.edit{cursor:crosshair}
.glow{filter:drop-shadow(0 0 5px rgba(31,216,96,.7))}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{display:flex;gap:12px;align-items:center;background:var(--in);border:1px solid var(--line);border-radius:18px;padding:10px}
.item svg.th{width:76px;height:56px;border-radius:12px;background:#0b0e0d;flex:none}
.item .in{flex:1;min-width:0}
.item .in b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .acts{display:flex;gap:6px}
.mini{padding:8px 11px;border-radius:11px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mut);min-height:36px}
.mini:hover{border-color:var(--g);color:var(--g)}
.mini.g{background:var(--g);color:var(--ink);border-color:var(--g)}
.tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut);margin-left:6px;vertical-align:middle}
.week{display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:14px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week i{width:100%;border-radius:8px;background:linear-gradient(180deg,var(--g),var(--g2));min-height:4px}
.week i.z{background:var(--line)}
.week span{font-size:11px;color:var(--mut)}
.week em{font-style:normal;font-size:10px;color:#cfd4da}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.sheet{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px}
.sheet h3{font-size:20px;margin:10px 0 6px}
.sheet ul{margin:12px 0 18px 18px;color:var(--mut);font-size:14px;line-height:1.7}
.sheet .stack{display:flex;flex-direction:column;gap:10px}
.cd{position:fixed;inset:0;z-index:60;background:rgba(6,8,7,.94);display:grid;place-items:center;font-family:var(--black);font-size:140px;color:var(--g);text-shadow:0 0 60px rgba(31,216,96,.6)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1f26;border:1px solid var(--g);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:70;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.run{background:var(--bg);background-image:radial-gradient(560px 280px at 50% -50px,rgba(31,216,96,.22),transparent 70%);background-repeat:no-repeat}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(31,216,96,.1);border:1px solid rgba(31,216,96,.4);color:var(--g)}
.pill.n{background:var(--in);border-color:var(--line);color:var(--mut)}
.beat{width:18px;height:18px;fill:var(--g);animation:beat 1s infinite}
.paused .beat{animation:none;opacity:.4}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.big{font-family:var(--black);font-weight:900;font-size:76px;text-align:center;letter-spacing:-.02em;margin:18px 0 2px;font-variant-numeric:tabular-nums}
.bigl{text-align:center;color:var(--mut);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.bar{height:12px;border-radius:99px;background:var(--in);border:1px solid var(--line);overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:99px;transition:width .3s}
.status{margin-top:14px;text-align:center;font-weight:800;padding:10px;border-radius:14px;background:var(--in);border:1px solid var(--line);font-size:14px}
.status.ok{color:var(--g);border-color:rgba(31,216,96,.5)}
.status.off{color:var(--warn);border-color:rgba(255,176,32,.5)}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cv{width:100%;height:auto;display:block;border-radius:22px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.splits{margin-top:6px}
.sp{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0}
.sp span:first-child{width:46px;color:var(--mut)}
.sp .b{flex:1;height:10px;background:var(--in);border-radius:99px;overflow:hidden}
.sp .b i{display:block;height:100%;background:var(--g);border-radius:99px}
.sp span:last-child{width:50px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:18px;line-height:1.5}
</style>
</head>
<body>

<div class="app" id="main">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
      <div>
        <div class="wm">WIL<b>FIT</b></div>
        <h1>Cardio</h1>
      </div>
    </div>
    <div class="tools">
      <button class="ibtn on" id="btnSound" aria-label="Alternar avisos de voz e som" title="Avisos de voz/som"></button>
      <button class="ibtn" id="btnFs" aria-label="Tela cheia" title="Tela cheia"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>
  <p class="sub" style="margin:-8px 0 16px">Seu treino, sua evolução.</p>

  <nav class="seg" id="tabs" aria-label="Seções do Cardio">
    <button class="on" data-tab="treinar">Treinar</button>
    <button data-tab="rotas">Rotas</button>
    <button data-tab="hist">Histórico</button>
  </nav>

  <section id="sec-treinar">
    <div class="card">
      <h2>Novo treino</h2>
      <p class="muted">Escolha o tipo de cardio de hoje.</p>
      <span class="lbl">Tipo de treino</span>
      <div class="types" id="types"></div>
    </div>

    <div class="card">
      <h2>Meta e ritmo</h2>
      <span class="lbl">Objetivo</span>
      <div class="seg sm" id="goalSeg">
        <button class="on" data-goal="dist">Distância</button>
        <button data-goal="time">Tempo</button>
        <button data-goal="free">Livre</button>
      </div>

      <div id="gKm" class="field"><span class="lbl">Distância (km)</span>
        <input type="text" inputmode="decimal" id="inKm" value="5" aria-label="Distância em quilômetros"><div class="err" id="eKm"></div></div>
      <div id="gMin" class="field" hidden><span class="lbl">Tempo (minutos)</span>
        <input type="text" inputmode="numeric" id="inMin" value="30" aria-label="Tempo em minutos"><div class="err" id="eMin"></div></div>

      <span class="lbl">Ritmo alvo (min/km)</span>
      <div class="stepper">
        <button id="pMinus" aria-label="Diminuir ritmo em 5 segundos">−</button>
        <input type="text" inputmode="numeric" id="inPace" value="6:00" aria-label="Ritmo alvo no formato minutos:segundos">
        <button id="pPlus" aria-label="Aumentar ritmo em 5 segundos">+</button>
      </div>
      <div class="err" id="ePace"></div>
      <div class="chips" id="paceChips"></div>

      <div class="tiles">
        <div class="tile"><small>Distância</small><b id="tKm">—</b><i>km</i></div>
        <div class="tile"><small>Tempo</small><b id="tTime">—</b><i>estimado</i></div>
        <div class="tile"><small>Ritmo</small><b id="tPace">—</b><i id="tSpeed">km/h</i></div>
      </div>

      <div id="gTread" hidden>
        <span class="lbl">Inclinação da esteira (%)</span>
        <input type="number" id="inInc" min="0" max="15" step="0.5" value="1">
        <p class="muted" style="margin-top:8px" id="treadNote"></p>
      </div>

      <span class="lbl">Seu peso (kg) — só para estimar calorias</span>
      <input type="number" id="inWeight" min="30" max="250" value="70">
    </div>

    <div class="card" id="cardRoute">
      <h2>Rota e GPS</h2>
      <p class="muted">Acompanhe o trajeto ao vivo e compare com uma rota planejada.</p>
      <span class="lbl">Rota planejada</span>
      <select id="routeSel" aria-label="Rota planejada"></select>
      <div style="margin-top:10px" id="routePrev"></div>
      <button class="btn ghost sm" id="useRouteKm" style="margin-top:10px" hidden>Usar a distância da rota como meta</button>

      <span class="lbl">Localização</span>
      <div class="gps" id="gpsBox">
        <span class="dot" id="gpsDot"></span>
        <div style="flex:1"><b id="gpsTitle">GPS desligado</b><span class="muted" id="gpsText"></span>
          <div class="row" style="margin-top:10px;gap:8px">
            <button class="mini g" id="gpsAsk">Permitir GPS</button>
            <button class="mini" id="gpsSim">Usar simulação</button>
          </div>
        </div>
      </div>
    </div>

    <button class="btn" id="btnStart" style="margin-top:18px">Iniciar treino</button>
  </section>

  <section id="sec-rotas" hidden>
    <div class="card">
      <h2>Criar rota</h2>
      <p class="muted">Toque no mapa para marcar os pontos do percurso. A distância é calculada na hora.</p>
      <div class="row" style="margin-top:12px">
        <div class="field"><span class="lbl" style="margin-top:0">Nome da rota</span><input type="text" id="edName" placeholder="Ex.: Volta da orla" maxlength="40"></div>
        <div class="field"><span class="lbl" style="margin-top:0">Cidade</span><input type="text" id="edCity" placeholder="Sua cidade" maxlength="40"></div>
      </div>
      <svg class="map edit" id="editorMap" viewBox="0 0 360 300" role="img" aria-label="Mapa para criar rota. Toque para adicionar pontos." style="margin-top:14px"></svg>
      <p class="muted" style="margin-top:8px;text-align:center">Mapa demonstrativo • 1 quadrado ≈ 320 m • No Wilfit entra o mapa real da cidade.</p>
      <div class="tiles">
        <div class="tile"><small>Distância</small><b id="edKm">0,00</b><i>km</i></div>
        <div class="tile"><small>Pontos</small><b id="edN">0</b><i>marcados</i></div>
        <div class="tile"><small>Tempo est.</small><b id="edT">—</b><i id="edTi">no ritmo alvo</i></div>
      </div>
      <div class="row" style="margin-top:12px;gap:8px">
        <button class="btn ghost sm" id="edUndo">Desfazer</button>
        <button class="btn ghost sm" id="edClose">Fechar circuito</button>
        <button class="btn ghost sm" id="edClear">Limpar</button>
      </div>
      <button class="btn ghost sm" id="edSuggest" style="margin-top:8px">Sugerir circuito com a meta de distância</button>
      <button class="btn" id="edSave" style="margin-top:12px">Salvar rota</button>
    </div>
    <div class="card">
      <h2>Minhas rotas</h2>
      <div class="list" id="routeList"></div>
    </div>
  </section>

  <section id="sec-hist" hidden>
    <div class="card">
      <h2>Últimos 7 dias</h2>
      <p class="muted" id="weekInfo"></p>
      <div class="week" id="week"></div>
    </div>
    <div class="card">
      <h2>Treinos</h2>
      <p class="muted">Toque em um treino para abrir o card de compartilhamento.</p>
      <div class="list" id="histList"></div>
    </div>
  </section>

  <p class="note">Protótipo do módulo Cardio • Treinos marcados como “demo” são dados demonstrativos.</p>
</div>

<div class="view run" id="runView" hidden>
  <div class="pills" style="justify-content:space-between">
    <div class="pills"><span class="pill" id="rType"></span><span class="pill n" id="rMode"></span></div>
    <svg class="beat" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  </div>
  <div class="big" id="rTime">00:00</div>
  <div class="bigl">Tempo</div>
  <div class="tiles">
    <div class="tile"><small>Distância</small><b id="rDist">0,00</b><i>km</i></div>
    <div class="tile"><small>Ritmo atual</small><b id="rPace">--:--</b><i>/km</i></div>
    <div class="tile"><small>Ritmo médio</small><b id="rAvg">--:--</b><i>/km</i></div>
  </div>
  <div class="bar"><i id="rBar"></i></div>
  <p class="muted" style="text-align:center;margin-top:8px" id="rBarLbl"></p>
  <div class="status" id="rStatus">Aguardando ritmo…</div>
  <svg class="map" id="rMap" viewBox="0 0 360 230" style="margin-top:14px" role="img" aria-label="Mapa do percurso ao vivo"></svg>
  <div id="rTread" class="card" style="padding:14px" hidden>
    <div class="row" style="align-items:center">
      <button class="mini" id="spMinus" style="min-height:46px;font-size:18px">−</button>
      <div style="text-align:center"><b class="black" style="font-size:22px" id="rSpeed">10,0</b><div class="muted">km/h • <span id="rInc"></span></div></div>
      <button class="mini" id="spPlus" style="min-height:46px;font-size:18px">+</button>
    </div>
  </div>
  <label class="muted" id="rDemoWrap" style="display:flex;gap:10px;align-items:center;margin-top:14px;justify-content:center"><input type="checkbox" id="rFast" style="width:18px;height:18px;accent-color:#1fd860"> Acelerar ×20 (só demonstração)</label>
  <div class="ctrl">
    <button class="btn ghost" id="rPause">Pausar</button>
    <button class="btn" id="rFinish">Finalizar</button>
  </div>
</div>

<div class="view" id="resultView" hidden>
  <div class="pills" style="justify-content:space-between;margin-bottom:6px">
    <h2 style="font-size:24px">Treino concluído 💚</h2>
    <button class="mini" id="resBack">Voltar</button>
  </div>
  <p class="muted" style="margin-bottom:14px">Seu card está pronto: baixe a imagem, compartilhe ou tire um print.</p>
  <div class="seg sm" id="fmtSeg" style="margin-bottom:14px">
    <button class="on" data-f="feed">Feed 4:5</button>
    <button data-f="story">Stories 9:16</button>
  </div>
  <canvas class="cv" id="cv" aria-label="Card de resultado do treino"></canvas>
  <div class="ctrl">
    <button class="btn" id="resShare">Compartilhar</button>
    <button class="btn ghost" id="resDl">Baixar imagem</button>
  </div>
  <button class="btn ghost sm" id="resCopy" style="margin-top:10px">Copiar resumo em texto</button>
  <div class="card">
    <h2>Resumo</h2>
    <div class="tiles" id="resTiles"></div>
    <span class="lbl">Parciais por km</span>
    <div class="splits" id="resSplits"></div>
  </div>
</div>

<div class="ov" id="modal" hidden><div class="sheet" id="modalBody"></div></div>
<div class="cd" id="cd" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const HEART='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
const UNIT=8;
const TYPES={
 esteira:{label:'Esteira',outdoor:false,icon:'<circle cx="14" cy="4.5" r="1.7"/><path d="M13 8l-2.5 3.5 3 2 1 4M10.5 11.5L7.5 12.5M14 8l2.5 3M3 21h14.5a3 3 0 0 0 2.8-2L22 16"/>'},
 corrida:{label:'Corrida de rua',outdoor:true,icon:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a4 4 0 0 0 0-8H8a4 4 0 0 1 0-8h8"/>'},
 caminhada:{label:'Caminhada',outdoor:true,icon:'<circle cx="13" cy="4.5" r="1.7"/><path d="M12 8l-3 3 1 4-2 5M12 8l3 3 3 1M10 15l3 2 1 4"/>'}
};
const CHIPS={esteira:['5:00','5:30','6:00','7:00','9:30'],corrida:['4:30','5:00','5:30','6:00','7:00'],caminhada:['8:30','9:30','10:00','11:00','12:00']};
const S={tab:'treinar',type:'corrida',goal:'dist',km:5,min:30,pace:360,incline:1,weight:70,routeId:'r1',gps:'idle',acc:null,sound:true,fmt:'feed'};
let R=null,timer=null,lastRes=null;

const f1=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const f2=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(Math.floor(n)).padStart(2,'0');
const fT=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`};
const fP=s=>(!isFinite(s)||s<=0||s>5999)?'--:--':`${Math.floor(Math.round(s)/60)}:${pad(Math.round(s)%60)}`;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function parsePace(v){v=String(v).trim();let m=v.match(/^(\d{1,2}):(\d{1,2})$/);if(m)return +m[2]<60?(+m[1]*60+ +m[2]):NaN;if(/^\d{1,2}$/.test(v))return +v*60;return NaN}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}
function U(a){return a.map(([x,y])=>({x:x*UNIT,y:y*UNIT}))}
function beep(f=880,d=.12){if(!S.sound)return;try{window.__ac=window.__ac||new(window.AudioContext||window.webkitAudioContext)();const a=window.__ac,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function say(t){if(!S.sound)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

const routes=[
 {id:'r1',name:'Volta do Parque',city:'Demonstração',closed:true,demo:true,pts:U([[80,70],[180,50],[280,80],[300,160],[240,230],[130,240],[60,170]])},
 {id:'r2',name:'Orla Beira-Rio',city:'Demonstração',closed:false,demo:true,pts:U([[30,230],[100,200],[170,215],[240,170],[310,150]])},
 {id:'r3',name:'Circuito do Centro',city:'Demonstração',closed:true,demo:true,pts:U([[120,100],[220,100],[220,190],[120,190]])}
];
const rPts=r=>r.closed&&r.pts.length>2?[...r.pts,r.pts[0]]:r.pts;
function rLen(r){const p=rPts(r);let L=0;for(let i=1;i<p.length;i++)L+=dist(p[i-1],p[i]);return L}
function pointAt(r,d){const p=rPts(r),seg=[];let T=0;for(let i=1;i<p.length;i++){const l=dist(p[i-1],p[i]);seg.push(l);T+=l}
 if(T<=0)return p[0];let m;if(r.closed)m=d%T;else{const k=d%(2*T);m=k>T?2*T-k:k}
 for(let i=0;i<seg.length;i++){if(m<=seg[i]){const f=seg[i]?m/seg[i]:0;return{x:p[i].x+(p[i+1].x-p[i].x)*f,y:p[i].y+(p[i+1].y-p[i].y)*f}}m-=seg[i]}return p[p.length-1]}
const getRoute=id=>routes.find(r=>r.id===id)||null;
function fit(pts,w,h,pd){let a=1e9,b=1e9,c=-1e9,d=-1e9;pts.forEach(p=>{a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y)});
 const bw=Math.max(c-a,60),bh=Math.max(d-b,60),s=Math.min((w-2*pd)/bw,(h-2*pd)/bh),cx=(a+c)/2,cy=(b+d)/2;
 return p=>({x:w/2+(p.x-cx)*s,y:h/2+(p.y-cy)*s})}
const poly=(pts,P)=>pts.map(p=>{const q=P(p);return q.x.toFixed(1)+','+q.y.toFixed(1)}).join(' ');
function thumb(pts,cls){const W=76,H=56;if(!pts||pts.length<2)return`<svg class="${cls||'th'}" viewBox="0 0 ${W} ${H}"><text x="38" y="33" fill="#5d646e" font-size="10" text-anchor="middle">sem rota</text></svg>`;
 const P=fit(pts,W,H,8);return`<svg class="${cls||'th'}" viewBox="0 0 ${W} ${H}"><polyline class="glow" points="${poly(pts,P)}" fill="none" stroke="#1fd860" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

const history=[];
function mkDemo(type,rid,km,pace,days){const r=getRoute(rid),path=[];const sp=[];
 if(TYPES[type].outdoor&&r){for(let d=0;d<=km*1000;d+=25)path.push(pointAt(r,d))}
 for(let i=0;i<Math.floor(km);i++){const p=pace+(((i*37)%11)-5)*3;sp.push({km:i+1,sec:p,pace:p})}
 const sec=km*pace,dt=new Date();dt.setDate(dt.getDate()-days);dt.setHours(7,10,0,0);
 return{id:'d'+type+days,date:dt,type,mode:TYPES[type].outdoor?'sim':'treadmill',distM:km*1000,sec,avgPace:pace,kcal:calcKcal(type,km,70,type==='esteira'?1:0),splits:sp,path,route:r?r.name:'',incline:type==='esteira'?1:0,speed:3600/pace,demo:true}}
function calcKcal(type,km,kg,inc){const base=type==='caminhada'?.55:.95;return Math.round(kg*km*(base+(type==='esteira'?inc*.03:0)))}
history.push(mkDemo('corrida','r1',5.2,348,2),mkDemo('caminhada','r3',3,620,3),mkDemo('esteira',null,4,370,5),mkDemo('corrida','r1',8,355,6));

<script>
/* ===== WILFIT • aba Cardio (módulo isolado em iframe) ===== */
(function(){
  var TAB_ID='wf-cardio-tab',active=false,frame=null,pend=false;
  var view=document.createElement('div');
  view.id='wf-cardio-view';
  view.style.cssText='position:fixed;left:0;right:0;top:0;bottom:0;z-index:40;background:#060807;display:none';
  document.body.appendChild(view);

  function findBar(){
    var all=document.body.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var el=all[i];
      if(el===view||view.contains(el))continue;
      var tx=el.textContent||'';
      if(tx.length>140||!/treinos/i.test(tx)||!/perfil/i.test(tx))continue;
      if(getComputedStyle(el).position!=='fixed')continue;
      var r=el.getBoundingClientRect();
      if(r.top<innerHeight*0.5||r.height<30||r.height>170)continue;
      while(el.children.length===1)el=el.children[0];
      return el;
    }
    return null;
  }
  function fixedTop(el){
    var n=el;
    while(n&&n!==document.body){
      if(getComputedStyle(n).position==='fixed')return n.getBoundingClientRect().top;
      n=n.parentNode;
    }
    return el.getBoundingClientRect().top;
  }
  function strip(n){
    if(n.nodeType!==1)return;
    [].slice.call(n.attributes).forEach(function(a){
      if(/^data-/.test(a.name)||/^on/.test(a.name)||a.name==='id'||a.name==='href'||a.name==='aria-current')n.removeAttribute(a.name);
    });
    ['on','act','active','sel','selected','current'].forEach(function(k){n.classList.remove(k);});
    [].slice.call(n.children).forEach(strip);
  }
  function ensure(){
    var t=document.getElementById(TAB_ID);
    if(t&&t.isConnected)return;
    var bar=findBar();
    if(!bar){if(active)closeCardio();return;}
    var ref=null;
    for(var i=0;i<bar.children.length;i++){
      if(/treinos/i.test(bar.children[i].textContent)){ref=bar.children[i];break;}
    }
    if(!ref)return;
    var c=ref.cloneNode(true);
    strip(c);
    c.id=TAB_ID;
    c.setAttribute('aria-label','Cardio');
    var w=document.createTreeWalker(c,NodeFilter.SHOW_TEXT,null),n,list=[];
    while((n=w.nextNode()))if(n.nodeValue.trim())list.push(n);
    list.forEach(function(tn){
      if(/treinos/i.test(tn.nodeValue)){
        tn.nodeValue=tn.nodeValue.replace(/^([^A-Za-zÀ-ÿ]*)/,function(m){return m.trim()?'🏃 ':m;}).replace(/meus\s+treinos|treinos/i,'Cardio');
      }else{
        tn.nodeValue='🏃';
      }
    });
    [].slice.call(c.querySelectorAll('svg')).forEach(function(s){
      var h=document.createElement('span');
      var sz=s.getAttribute('width')||'22';
      h.innerHTML='<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>';
      s.parentNode.replaceChild(h.firstChild,s);
    });
    ref.parentNode.insertBefore(c,ref.nextSibling);
    if(getComputedStyle(bar).display==='grid'){
      bar.style.gridTemplateColumns='repeat('+bar.children.length+',1fr)';
    }
    if(active)paint(true);
  }
  function schedule(){
    if(pend)return;pend=true;
    requestAnimationFrame(function(){pend=false;ensure();});
  }
  function paint(on){
    var tab=document.getElementById(TAB_ID);
    if(!tab||!tab.parentNode)return;
    [].slice.call(tab.parentNode.children).forEach(function(ch){
      if(ch!==tab)ch.style.opacity=on?'.5':'';
    });
    tab.style.opacity='1';
    tab.style.color=on?'var(--g)':'';
    [].slice.call(tab.querySelectorAll('*')).forEach(function(e){e.style.color=on?'var(--g)':'';});
  }
  function place(){
    var tab=document.getElementById(TAB_ID);
    var top=tab&&tab.parentNode?fixedTop(tab.parentNode):innerHeight;
    view.style.bottom=Math.max(0,innerHeight-top)+'px';
  }
  function openCardio(){
    place();
    if(!frame){
      frame=document.createElement('iframe');
      frame.title='Wilfit Cardio';
      frame.setAttribute('allow','geolocation; fullscreen');
      frame.setAttribute('allowfullscreen','');
      frame.style.cssText='border:0;width:100%;height:100%;display:block;background:#060807';
      frame.srcdoc=document.getElementById('wf-cardio-src').textContent.replace(/<\\\//g,'</');
      view.appendChild(frame);
    }
    view.style.display='block';
    active=true;
    paint(true);
  }
  function closeCardio(){
    view.style.display='none';
    active=false;
    paint(false);
  }
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest?e.target.closest('#'+TAB_ID):null;
    if(t){
      e.preventDefault();e.stopPropagation();
      active?closeCardio():openCardio();
      return;
    }
    if(active){
      var tab=document.getElementById(TAB_ID);
      if(tab&&tab.parentNode&&tab.parentNode.contains(e.target))closeCardio();
    }
  },true);
  window.addEventListener('resize',function(){if(active)place();});
  new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
  schedule();
})();
/* Ícone de cardio: coração minimalista (traço, como os demais ícones) */
(function(){
  var HEART_PATH='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z';
  function heartSvg(ref){
    var w=22,sw='2',cls='';
    if(ref){
      var r=ref.getBoundingClientRect();
      if(r.width>8&&r.width<64)w=Math.round(r.width);
      sw=ref.getAttribute('stroke-width')||sw;
      cls=ref.getAttribute('class')||'';
    }
    return '<svg data-heart="1" class="'+cls+'" width="'+w+'" height="'+w+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+HEART_PATH+'"/></svg>';
  }
  function findTab(){
    var els=document.querySelectorAll('button,a,[role=tab],[role=button],li,div');
    var best=null,bl=1e9;
    for(var i=0;i<els.length;i++){
      var el=els[i],tx=(el.textContent||'').trim().toLowerCase();
      if(tx.indexOf('cardio')<0||tx.length>14)continue;
      var p=el.parentElement;
      if(!p||p.children.length<3)continue;
      if(tx.length<bl){best=el;bl=tx.length;}
    }
    return best;
  }
  function apply(){
    var tab=findTab();
    if(!tab||tab.querySelector('[data-heart]'))return;
    var ref=null,sibs=tab.parentElement.children;
    for(var i=0;i<sibs.length;i++){if(sibs[i]!==tab){ref=sibs[i].querySelector('svg');if(ref)break;}}
    var svg=tab.querySelector('svg');
    if(svg){svg.outerHTML=heartSvg(ref||svg);return;}
    var ch=tab.children;
    for(var j=0;j<ch.length;j++){
      if((ch[j].textContent||'').toLowerCase().indexOf('cardio')<0){ch[j].innerHTML=heartSvg(ref);return;}
    }
    for(var k=0;k<tab.childNodes.length;k++){
      var n=tab.childNodes[k];
      if(n.nodeType===3&&/cardio/i.test(n.nodeValue)){
        n.nodeValue=n.nodeValue.replace(/^[^A-Za-zÀ-ÿ]*/,'');
        var s=document.createElement('span');
        s.style.display='block';s.style.lineHeight='0';s.innerHTML=heartSvg(ref);
        tab.insertBefore(s,n);return;
      }
    }
  }
  var t=null;
  function sched(){clearTimeout(t);t=setTimeout(apply,30);}
  new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});
  sched();
})();
