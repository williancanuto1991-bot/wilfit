#zv .zbtn.zx{background:#1ed760;color:#06140a;border-color:#1ed760}
#zv .zhint{position:absolute;left:0;right:0;bottom:0;text-align:center;color:rgba(255,255,255,.65);font-size:12px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.65));pointer-events:none}
</style>
<script>
(function(){
  var ov=document.createElement('div');
  ov.id='zv';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Foto do exercício ampliada');
  ov.innerHTML='<div class="zs"><img alt="Foto do exercício" draggable="false"></div>'+
    '<div class="zbar"><span class="zpct">100%</span><span class="zgap"></span>'+
    '<button type="button" class="zbtn" data-z="out" aria-label="Diminuir zoom">−</button>'+
    '<button type="button" class="zbtn" data-z="in" aria-label="Aumentar zoom">+</button>'+
    '<button type="button" class="zbtn" data-z="reset" aria-label="Tamanho original" style="font-size:13px">1:1</button>'+
    '<button type="button" class="zbtn zx" data-z="close" aria-label="Fechar">✕</button></div>'+
    '<div class="zhint">Pinça ou roda do mouse para zoom · toque duplo para ampliar · arraste para mover</div>';
  document.body.appendChild(ov);

  var stage=ov.querySelector('.zs'),img=ov.querySelector('img'),pct=ov.querySelector('.zpct');
  var sc=1,tx=0,ty=0,pts={},startDist=0,startSc=1,lastMid=null,moved=false,lastTap=0,downPos=null,prevOverflow='';

  function drawn(){
    var sw=stage.clientWidth,sh=stage.clientHeight,nw=img.naturalWidth||sw,nh=img.naturalHeight||sh;
    var f=Math.min(sw/nw,sh/nh);
    return {w:nw*f,h:nh*f,sw:sw,sh:sh};
  }
  function clamp(){
    var d=drawn();
    var mx=Math.max(0,(d.w*sc-d.sw)/2),my=Math.max(0,(d.h*sc-d.sh)/2);
    tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty));
    if(sc<=1){tx=0;ty=0;}
  }
  function paint(){
    img.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
    pct.textContent=Math.round(sc*100)+'%';
  }
  function zoomAt(cx,cy,ns){
    ns=Math.max(1,Math.min(6,ns));
    var r=stage.getBoundingClientRect();
    var px=cx-(r.left+r.width/2),py=cy-(r.top+r.height/2),k=ns/sc;
    tx=px-(px-tx)*k;ty=py-(py-ty)*k;sc=ns;
    clamp();paint();
  }
  function zoomCenter(f){
    var r=stage.getBoundingClientRect();
    zoomAt(r.left+r.width/2,r.top+r.height/2,sc*f);
  }
  function reset(){sc=1;tx=0;ty=0;paint();}
  function open(src){
    pts={};reset();
    img.src=src.currentSrc||src.src;
    prevOverflow=document.body.style.overflow;
    document.body.style.overflow='hidden';
    ov.classList.add('on');
    var c=ov.querySelector('[data-z="close"]');if(c)c.focus();
  }
  function close(){
    ov.classList.remove('on');
    document.body.style.overflow=prevOverflow;
    pts={};
    img.removeAttribute('src');
  }

  ov.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('[data-z]'):null;
    if(!b)return;
    e.stopPropagation();
    var a=b.getAttribute('data-z');
    if(a==='close')close();
    else if(a==='in')zoomCenter(1.5);
    else if(a==='out')zoomCenter(1/1.5);
    else if(a==='reset')reset();
  });

  stage.addEventListener('pointerdown',function(e){
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(pts);
    if(ids.length===1){downPos={x:e.clientX,y:e.clientY};moved=false;}
    if(ids.length===2){
      var a=pts[ids[0]],b=pts[ids[1]];
      startDist=Math.hypot(a.x-b.x,a.y-b.y)||1;startSc=sc;
      lastMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};moved=true;
    }
  });
  stage.addEventListener('pointermove',function(e){
    var p=pts[e.pointerId];if(!p)return;
    var ids=Object.keys(pts);
    if(ids.length===2){
      pts[e.pointerId]={x:e.clientX,y:e.clientY};
      var a=pts[ids[0]],b=pts[ids[1]];
      var dist=Math.hypot(a.x-b.x,a.y-b.y)||1;
      var mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      zoomAt(mid.x,mid.y,startSc*dist/startDist);
      tx+=mid.x-lastMid.x;ty+=mid.y-lastMid.y;
      clamp();paint();lastMid=mid;
    }else if(ids.length===1){
      var dx=e.clientX-p.x,dy=e.clientY-p.y;
      p.x=e.clientX;p.y=e.clientY;
      if(sc>1){tx+=dx;ty+=dy;clamp();paint();}
      if(downPos&&Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y)>6)moved=true;
    }
  });
  function up(e){
    if(!pts[e.pointerId])return;
    var wasSingle=Object.keys(pts).length===1;
    delete pts[e.pointerId];
    if(Object.keys(pts).length===1)moved=true;
    if(e.type==='pointerup'&&wasSingle&&!moved){
      var now=Date.now();
      if(now-lastTap<300){
        if(sc>1.01)reset();else zoomAt(e.clientX,e.clientY,2.5);
        lastTap=0;
      }else lastTap=now;
    }
  }
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',function(e){
    e.preventDefault();
    zoomAt(e.clientX,e.clientY,sc*(e.deltaY<0?1.15:1/1.15));
  },{passive:false});
  window.addEventListener('resize',function(){if(ov.classList.contains('on')){clamp();paint();}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('on'))return;
    if(e.key==='Escape')close();
    else if(e.key==='+'||e.key==='=')zoomCenter(1.25);
    else if(e.key==='-')zoomCenter(1/1.25);
    else if(e.key==='0')reset();
  });

  /* abre ao tocar em qualquer foto de exercício */
  document.addEventListener('click',function(e){
    var t=e.target;
    if(!t||!t.closest||ov.contains(t))return;
    var im=t.closest('img.thumb');
    if(!im||!im.src)return;
    e.preventDefault();e.stopPropagation();
    open(im);
  },true);
})();
</script>

<style id="wf-ios-fit">
/* ===== Ajuste para iPhone (área segura / app na tela de início) ===== */
html{height:100%;overscroll-behavior-y:none}
body{min-height:100%;overscroll-behavior-y:none;-webkit-touch-callout:none}
#root{
  min-height:100vh;
  padding-top:calc(18px + env(safe-area-inset-top));
  padding-left:calc(16px + env(safe-area-inset-left));
  padding-right:calc(16px + env(safe-area-inset-right));
  padding-bottom:calc(130px + env(safe-area-inset-bottom));
}
@supports (height:100dvh){#root{min-height:100dvh}}
/* faixa escura sob a barra de status (só aparece se o iPhone sobrepor o app à barra) */
#wf-statusbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#0a0a0a;z-index:1000;pointer-events:none}
/* alvos de toque confortáveis */
.btn{min-height:44px;touch-action:manipulation}
button,a,[role=button]{touch-action:manipulation}
img{max-width:100%}
/* botão Voltar: maior, fixo no topo e abaixo da barra de status */
.wf-back{
  display:inline-flex !important;align-items:center;gap:6px;
  width:auto !important;min-height:44px;min-width:44px;
  padding:10px 16px !important;margin:0 0 12px !important;
  position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:40;
  background:var(--card) !important;color:var(--text) !important;
  border:1px solid var(--line) !important;border-radius:999px !important;
  font-size:15px;font-weight:700;cursor:pointer;
}
@media (max-width:360px){
  #root{padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
  h1{font-size:23px}
  .two{gap:6px}
}
</style>
<script>
(function(){
  /* faixa da barra de status */
  var st=document.createElement('div');st.id='wf-statusbar';document.body.appendChild(st);

  /* ---------- menu inferior: respeita a barra do iPhone ---------- */
  function fixNav(){
    var root=document.getElementById('root')||document.body;
    var els=root.querySelectorAll('*');
    for(var i=0;i<els.length;i++){
      var el=els[i];
      if(el.dataset.wfNav)continue;
      var cs=getComputedStyle(el);
      if(cs.position!=='fixed')continue;
      var r=el.getBoundingClientRect();
      if(parseFloat(cs.bottom)>1||r.height>180||r.height<30||r.width<innerWidth*0.6)continue;
      el.dataset.wfNav='1';
      el.style.boxSizing='border-box';
      el.style.height='calc('+r.height+'px + env(safe-area-inset-bottom))';
      el.style.paddingBottom='calc('+cs.paddingBottom+' + env(safe-area-inset-bottom))';
    }
  }
  /* mesmo para um menu fixo filho direto do body */
  function fixNavBody(){
    var ch=document.body.children;
    for(var i=0;i<ch.length;i++){
      var el=ch[i];
      if(el.id==='root'||el.id==='wf-statusbar'||el.dataset.wfNav||el.tagName==='SCRIPT'||el.tagName==='STYLE')continue;
      var cs=getComputedStyle(el);
      if(cs.position!=='fixed')continue;
      var r=el.getBoundingClientRect();
      if(parseFloat(cs.bottom)>1||r.top<=1||r.height>180||r.height<30||r.width<innerWidth*0.6)continue;
      el.dataset.wfNav='1';
      el.style.boxSizing='border-box';
      el.style.height='calc('+r.height+'px + env(safe-area-inset-bottom))';
      el.style.paddingBottom='calc('+cs.paddingBottom+' + env(safe-area-inset-bottom))';
    }
  }

  /* ---------- botão Voltar ---------- */
  var BACK=/^([←‹<⬅◀]\s*)?(voltar|back)$|^[←‹<⬅◀]$/i;
  function fixBack(){
    var root=document.getElementById('root');if(!root)return;
    var rt=root.getBoundingClientRect().top;
    var list=root.querySelectorAll('button,a,[role=button],[onclick]');
    for(var i=0;i<list.length;i++){
      var el=list[i];
      if(el.dataset.wfBack)continue;
      var t=(el.textContent||'').trim();
      if(t.length>14||!BACK.test(t))continue;
      if(el.getBoundingClientRect().top-rt>170)continue; /* só o Voltar do topo */
      el.dataset.wfBack='1';
      el.classList.add('wf-back');
    }
  }

  var pend=false;
  function run(){pend=false;try{fixNav();fixNavBody();fixBack();}catch(e){}}
  function schedule(){if(pend)return;pend=true;setTimeout(run,120);}
  new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
  window.addEventListener('resize',schedule);
  window.addEventListener('orientationchange',schedule);
  schedule();

  /* ---------- visualizador de fotos: botões abaixo da barra de status + deslizar para fechar ---------- */
  function findOv(){
    var ch=document.body.children;
    for(var i=0;i<ch.length;i++){
      var el=ch[i];
      if(el.id==='root'||el.id==='wf-statusbar'||el.tagName==='SCRIPT'||el.tagName==='STYLE')continue;
      var cs=getComputedStyle(el);
      if(cs.position!=='fixed'||cs.display==='none'||cs.visibility==='hidden'||parseFloat(cs.opacity)<0.05||cs.pointerEvents==='none')continue;
      if(!el.querySelector('img'))continue;
      var r=el.getBoundingClientRect();
      if(r.width>=innerWidth*0.9&&r.height>=innerHeight*0.9)return el;
    }
    return null;
  }
  function fixOvTop(){
    var ov=findOv();if(!ov)return;
    var bs=ov.querySelectorAll('button');
    for(var i=0;i<bs.length;i++){
      var el=bs[i];
      while(el&&el!==ov){
        var cs=getComputedStyle(el);
        if(cs.position==='fixed'||cs.position==='absolute'){
          var top=parseFloat(cs.top);
          if(!isNaN(top)&&top<120&&!el.dataset.wfT){
            el.dataset.wfT='1';
            el.style.top='calc('+top+'px + env(safe-area-inset-top))';
          }
          break;
        }
        el=el.parentElement;
      }
    }
  }
  function scaleOf(ov){
    var im=ov.querySelector('img'),s=1;
    while(im&&im!==ov.parentElement){
      var m=getComputedStyle(im).transform;
      if(m&&m!=='none'){
        var v=m.match(/matrix3d\(([^)]+)\)/)||m.match(/matrix\(([^)]+)\)/);
        if(v){var a=Math.abs(parseFloat(v[1].split(',')[0]));if(a>s)s=a;}
      }
      if(im===ov)break;
      im=im.parentElement;
    }
    return s;
  }
  function closeOv(ov){
    var bs=ov.querySelectorAll('button,[role=button]');
    for(var i=0;i<bs.length;i++){
      var t=(bs[i].textContent||'').trim(),a=(bs[i].getAttribute('aria-label')||'').toLowerCase();
      if(t==='✕'||t==='×'||t==='x'||t==='X'||a.indexOf('fechar')>-1||a.indexOf('close')>-1){bs[i].click();return;}
    }
    document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  }
  var ov=null,sx=0,sy=0,dy=0,drag=false,prev={};
  function restore(){
    if(!ov)return;
    ov.style.transform=prev.t||'';ov.style.opacity=prev.o||'';ov.style.transition=prev.tr||'';
  }
  document.addEventListener('touchstart',function(e){
    drag=false;dy=0;
    if(e.touches.length!==1)return;
    ov=findOv();if(!ov)return;
    if(e.target.closest&&e.target.closest('button,[role=button]'))return;
    if(scaleOf(ov)>1.02)return;
    prev={t:ov.style.transform,o:ov.style.opacity,tr:ov.style.transition};
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;drag=true;
  },{passive:true,capture:true});
  document.addEventListener('touchmove',function(e){
    if(!drag||!ov)return;
    if(e.touches.length!==1){drag=false;restore();return;}
    var x=e.touches[0].clientX-sx;dy=e.touches[0].clientY-sy;
    if(dy>0&&dy>Math.abs(x)*1.2){
      ov.style.transition='none';
      ov.style.transform='translateY('+dy+'px)';
      ov.style.opacity=String(Math.max(0.3,1-dy/420));
    }
  },{passive:true,capture:true});
  function endDrag(){
    if(!drag||!ov)return;
    drag=false;
    var o=ov;
    if(dy>110){
      o.style.transition='transform .18s ease, opacity .18s ease';
      o.style.transform='translateY(100vh)';o.style.opacity='0';
      setTimeout(function(){closeOv(o);setTimeout(function(){restore();},60);},190);
    }else{
      o.style.transition='transform .18s ease, opacity .18s ease';
      o.style.transform=prev.t||'';o.style.opacity=prev.o||'';
      setTimeout(function(){o.style.transition=prev.tr||'';},200);
    }
    dy=0;
  }
  document.addEventListener('touchend',endDrag,{passive:true,capture:true});
  document.addEventListener('touchcancel',endDrag,{passive:true,capture:true});

  /* ajusta os botões do visualizador logo depois que a foto abre */
  document.addEventListener('click',function(e){
    if(e.target&&e.target.closest&&e.target.closest('img.thumb'))setTimeout(fixOvTop,80);
  },true);
})();
</script>
<style>
@keyframes wfIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes wfFade{from{opacity:0}to{opacity:1}}
.wf-in{animation:wfIn .28s cubic-bezier(.22,.61,.36,1) backwards}
.wf-fade{animation:wfFade .25s ease backwards}
@media (prefers-reduced-motion:reduce){.wf-in,.wf-fade{animation:none}}
</style>
<script>
/* transição suave ao trocar de aba (só ao tocar no menu inferior) */
(function(){
  var until=0;
  function cs(el){return getComputedStyle(el);}
  function inFixed(el){
    for(var n=el;n&&n!==document.body&&n!==document.documentElement;n=n.parentElement){
      var p=cs(n).position;
      if(p==='fixed'||p==='sticky')return true;
    }
    return false;
  }
  function hasFixedInside(el){
    var all=el.getElementsByTagName('*');
    for(var i=0;i<all.length&&i<800;i++){
      if(cs(all[i]).position==='fixed')return true;
    }
    return false;
  }
  function strip(v){return (v||'').replace(/\bwf-(in|fade)\b/g,'').replace(/\s+/g,' ').trim();}
  function play(el){
    if(!el||el.nodeType!==1)return;
    var tg=el.tagName;
    if(tg==='SCRIPT'||tg==='STYLE'||tg==='LINK'||tg==='META')return;
    if(el===document.body||el===document.documentElement)return;
    var now=Date.now();
    if(el.__wf&&now-el.__wf<450)return;
    if(inFixed(el))return;
    el.__wf=now;
    /* se o bloco contém o menu fixo, anima só a opacidade (transform quebraria o position:fixed) */
    var cls=hasFixedInside(el)?'wf-fade':'wf-in';
    el.classList.remove('wf-in','wf-fade');
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(function(){el.classList.remove('wf-in','wf-fade');},360);
  }
  var mo=new MutationObserver(function(list){
    if(Date.now()>until)return;
    list.forEach(function(m){
      if(m.type==='childList'){
        m.addedNodes.forEach(play);
      }else if(m.type==='attributes'){
        var t=m.target;
        if(m.attributeName==='class'&&strip(m.oldValue)===strip(t.getAttribute('class')))return;
        if(t.getClientRects().length)play(t);
      }
    });
  });
  mo.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden'],attributeOldValue:true});

  /* detecta toque no menu inferior (elemento fixo na parte de baixo da tela) */
  document.addEventListener('click',function(e){
    var n=e.target;
    while(n&&n!==document.body&&n!==document.documentElement){
      var p=cs(n).position;
      if(p==='fixed'||p==='sticky'){
        var r=n.getBoundingClientRect();
        if(r.top>window.innerHeight*0.5&&r.bottom>=window.innerHeight-4&&r.height<160){
          until=Date.now()+450;
        }
        return;
      }
      n=n.parentElement;
    }
  },true);
})();
</script>
<script>
/* WILFIT: transição suave ao trocar de aba (isolada, não altera o resto do app) */
(function(){
  if(window.__wfTabAnim)return;
  window.__wfTabAnim=true;
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  if(!Element.prototype.animate)return;

  var pending=0;

  function getRoot(){return document.getElementById('root')||document.body;}
  function isFixed(el){var p=getComputedStyle(el).position;return p==='fixed'||p==='sticky';}
  function hasFixed(el){
    var all=el.querySelectorAll('*');
    for(var i=0;i<all.length&&i<400;i++){if(isFixed(all[i]))return true;}
    return false;
  }
  function visible(c){
    return c.tagName!=='SCRIPT'&&c.tagName!=='STYLE'&&!isFixed(c);
  }
  function targets(){
    var list=[].slice.call(getRoot().children).filter(visible);
    if(list.length===1&&list[0].children.length>1){
      var inner=[].slice.call(list[0].children).filter(visible);
      if(inner.length)list=inner;
    }
    return list;
  }
  function play(){
    targets().forEach(function(el,i){
      /* transform em ancestral quebra elementos fixed; nesse caso anima só opacidade */
      var kf=hasFixed(el)
        ?[{opacity:0},{opacity:1}]
        :[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}];
      el.animate(kf,{duration:240,delay:Math.min(i,6)*25,easing:'cubic-bezier(.22,.8,.3,1)',fill:'backwards'});
    });
  }

  /* toque no menu inferior (elemento fixo colado no rodapé) marca a troca de aba */
  document.addEventListener('click',function(e){
    var n=e.target;
    while(n&&n!==document.body&&n!==document.documentElement){
      if(isFixed(n)){
        var r=n.getBoundingClientRect();
        if(r.top>window.innerHeight*0.5&&r.bottom>=window.innerHeight-4&&r.height<160){
          pending=Date.now();
        }
        return;
      }
      n=n.parentElement;
    }
  },true);

  /* quando o app redesenha a tela logo após o toque, dispara a animação */
  var obs=new MutationObserver(function(){
    if(pending&&Date.now()-pending<700){
      pending=0;
      requestAnimationFrame(play);
    }
  });
  obs.observe(getRoot(),{childList:true,subtree:true});
})();
</script>
